services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: app_meals
      POSTGRES_PASSWORD: app_meals
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_meals -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
